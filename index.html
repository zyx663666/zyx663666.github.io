        <div class="imglist">
            <a href="#" class="show"><img src="assets/images/banner1.png" alt=""></a>

    <script>
        window.onload=function(){
            let imglist = document.querySelectorAll('.imglist>a')
            let leftBtn = document.querySelector('.leftBtn')
            let rightBtn = document.querySelector('.rightBtn')
            let btnlist = document.querySelectorAll('.btnlist>span')

            let index = 0;
            let time;

            autoPlay();
            btnClick();
            
            function autoPlay(){
                time = setInterval(()=>{
                    //index++;
                    index==imglist.length-1?index=0:index++;//防止越界。
                    public();
                },3000)
            }
            leftBtn.onclick=function(){
                //使得操作的时候不自动播放
                clearInterval(time);
                
                index==0?index=imglist.length-1:index--;
                public();

                //继续播放
                autoPlay();
            }
            rightBtn.onclick=function(){
                clearInterval(time);
                index==imglist.length-1?index=0:index++;//防止越界。
                public();
                clearInterval(time);
            }

            function public(){
                for(let i=0;i<imglist.length;i++){
                    imglist[i].classList.remove('show');
                    btnlist[i].classList.remove('che');
                }
                imglist[index].classList.add('show');
                btnlist[index].classList.add('che');
            }
            //点击下方的按钮实现切换
            function btnClick(){
                for(let i=0;i<btnlist.length;i++){
                    btnlist[i].onclick=function(){
                        clearInterval(time);
                        index=i;
                        public();
                        autoPlay();
                    }
                }
            }
        }
    </script>
